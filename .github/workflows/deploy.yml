name: Build & Push Server Image

on:
  push:
    branches: [main]
    # Only the things that end up inside the image. A docs-only commit should not spend
    # an hour of runner time rebuilding TrinityCore.
    paths:
      - 'core'
      - 'sql/**'
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: prabowow-server

jobs:
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    # A cold TrinityCore build is 40-70 minutes on a 2-core runner; the default 360 min
    # timeout is plenty, but be explicit so a hung build fails instead of burning quota.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Without this, core/ is an empty directory and the build fails on the first
          # cmake line. The bot vendor/ submodules are not needed to compile the server,
          # so only core is fetched.
          submodules: false

      - name: Check out the core submodule only
        run: git submodule update --init --depth 1 core

      - name: Lowercase the image owner (Docker requires lowercase names)
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # The build is compiled with WITHOUT_GIT=1, so the binary's own banner cannot
          # report a revision. These labels are where the real commit is recorded.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Keeps the next build incremental instead of another cold hour. If the Actions
          # cache ever hits its 10 GB limit and starts evicting mid-build, drop to mode=min.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deployment is NOT automatic. The central Watchtower on the VPS only touches
      # containers labeled com.centurylinklabs.watchtower.enable=true, and this stack is
      # deliberately unlabeled — rebuilding a live game world would disconnect players.
      # Deploy on purpose:
      #   docker compose -f apps/renowow/docker-compose.yml --env-file apps/renowow/.env pull
      #   docker compose -f apps/renowow/docker-compose.yml --env-file apps/renowow/.env up -d
      - name: Deployment reminder
        run: |
          echo "Image pushed. Deploy manually on the VPS:"
          echo "  cd /srv/vps-infra"
          echo "  docker compose -f apps/renowow/docker-compose.yml --env-file apps/renowow/.env pull"
          echo "  docker compose -f apps/renowow/docker-compose.yml --env-file apps/renowow/.env up -d"
