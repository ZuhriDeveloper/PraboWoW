# ── PraboWoW — Cataclysm 4.3.4 server stack ──────────────────────────────────────────────
#
# This file is CANONICAL. vps-infra/apps/renowow/docker-compose.yml is a mirror of it; when
# you change one, change the other (same arrangement Materia uses).
#
# MANUAL stack — deliberately NO watchtower labels. CI still builds and pushes the image on
# every push to main, but the VPS only moves when you say so:
#   docker compose -f apps/renowow/docker-compose.yml --env-file apps/renowow/.env pull
#   docker compose -f apps/renowow/docker-compose.yml --env-file apps/renowow/.env up -d
#
# NOT HTTP. WoW speaks raw TCP on 3724/8085, so Caddy is not involved at all — it can only
# reverse-proxy HTTP. The ports are published straight to the host and opened in ufw
# (scripts/bootstrap.sh). If the realm address is a domain, its DNS record must be
# "DNS only" — a Cloudflare-proxied record breaks the game connection.

services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER:-trinity}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # sql_mode is MySQL 8's default minus NO_ZERO_DATE / NO_ZERO_IN_DATE / ONLY_FULL_GROUP_BY.
    # The TDB dump is frozen at January 2022 and carries zero dates that a stock MySQL 8
    # rejects mid-import, which would leave the world database half-populated. Strictness is
    # otherwise kept.
    #
    # performance_schema is off because it costs 300-400 MB of baseline RSS for insight
    # nobody is going to read on a single-player server, and this host has ~6 GB free with
    # the Ragnarok and monitoring stacks already resident.
    command: >
      --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
      --innodb-buffer-pool-size=${DB_BUFFER_POOL:-768M}
      --performance-schema=OFF
      --max-allowed-packet=64M
    volumes:
      - renowow_db:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    mem_limit: ${DB_MEM_LIMIT:-1200m}
    networks:
      - renowow-net
    # No `ports:` on purpose — the database is reachable only from this stack's network.
    healthcheck:
      # CMD-SHELL, not CMD: the exec form has no shell, so $MYSQL_ROOT_PASSWORD would be
      # passed to mysqladmin as that literal string and the probe would never go healthy.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  world:
    image: ${GHCR_PREFIX}/prabowow-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["worldserver"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8085:8085"
      # 8086 is NOT optional and has no WotLK equivalent, which is exactly why it gets
      # missed. Cataclysm opens a SECOND world connection after character select, and
      # WorldSession::SendConnectToInstance overwrites the realm's port with
      # InstanceServerPort (default 8086, worldserver.conf.dist:165) before telling the
      # client where to go. With only 8085 published the client is sent to a closed port,
      # retries five times and aborts login with "failed to connect 5 times to world
      # socket" — while the realm list and the character screen work perfectly, because
      # those only ever use the first connection.
      - "8086:8086"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-trinity}
      DB_PASSWORD: ${DB_PASSWORD}
      RATE_XP: ${RATE_XP:-5}
      RATE_DROP_ITEM: ${RATE_DROP_ITEM:-5}
      RATE_DROP_MONEY: ${RATE_DROP_MONEY:-5}
      REALM_ID: ${REALM_ID:-1}
      # worldserver caches realmlist at startup and uses it to tell the client where to open
      # Cataclysm's second connection after character select. The entrypoint writes the row
      # before starting the server, so this must be set here too, not only on `auth`.
      REALM_ADDRESS: ${REALM_ADDRESS}
      REALM_PORT: ${REALM_PORT:-8085}
    volumes:
      # Client-derived data: 5.2 GB, uploaded once with tools/upload-client-data.ps1, never
      # in git and never in the image. Read-only — the server has no business writing here.
      - ${DATA_PATH:-/srv/renowow/data}:/trinity/data:ro
      - renowow_tdb:/trinity/tdb
      - renowow_logs:/trinity/logs
    # Both flags are load-bearing, not cosmetic. worldserver's CLI thread reads stdin; when
    # stdin is not a real console it gets EOF and shuts the process down cleanly with
    # "Halting process..." (documented in docs/phase-1-checklist.md). Without a TTY the
    # container exits a few seconds after start and it looks exactly like a crash.
    # They also keep `docker attach` giving a usable TC> console for GM commands.
    tty: true
    stdin_open: true
    mem_limit: ${WORLD_MEM_LIMIT:-3g}
    networks:
      - renowow-net

  auth:
    image: ${GHCR_PREFIX}/prabowow-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["authserver"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3724:3724"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-trinity}
      DB_PASSWORD: ${DB_PASSWORD}
      REALM_ID: ${REALM_ID:-1}
      # What the client is told to connect to after login. On first boot the auth database
      # may not exist yet, so the entrypoint retries this in the background for 10 minutes.
      REALM_ADDRESS: ${REALM_ADDRESS}
      REALM_PORT: ${REALM_PORT:-8085}
    volumes:
      - renowow_logs:/trinity/logs
    tty: true
    stdin_open: true
    mem_limit: ${AUTH_MEM_LIMIT:-256m}
    networks:
      - renowow-net

volumes:
  renowow_db:      # precious: accounts and characters live here — backed up by scripts/backup-db.sh
  renowow_tdb:     # TDB .sql, downloaded on first start; safe to delete after the import
  renowow_logs:

networks:
  renowow-net:
    driver: bridge
